name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly. Default setup only exposes schedule: weekly, not an exact cron.
    # 07:17 UTC Monday is 02:17 AM ET (America/New_York, standard time).
    - cron: "17 7 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    # Rendered names must stay exactly "Analyze (javascript-typescript)" and
    # "Analyze (python)" to match the existing CodeQL check names that
    # ruleset 9566021's code_scanning rule evaluates. Do not rename.
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both match default setup's build-mode: none, so no autobuild step.
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{matrix.language}}"
